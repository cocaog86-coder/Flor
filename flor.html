<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flor para ti</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="flor.css" />
    <style>
      /* ── Layout lado a lado ─────────────────────────────── */
      html, body {
        height: 100%;
        margin: 0;
        padding: 0;
        background-color: hsl(155, 18%, 10%);
      }

      body {
        display: flex;
        flex-direction: row;
        align-items: stretch;
      }

      /* Mitad izquierda: la flor */
      #flor-wrap {
        position: relative;
        flex: 0 0 50%;
        height: 100vh;
        overflow: hidden;
      }

      /* La .scene del CSS original usa position:absolute, left:0, top:0 */
      /* Al estar dentro de #flor-wrap hereda su tamaño correctamente */

      /* Divisor sutil */
      #flor-wrap::after {
        content: '';
        position: absolute;
        top: 10%;
        right: 0;
        width: 0.5px;
        height: 80%;
        background: linear-gradient(
          to bottom,
          transparent,
          rgba(255,255,255,0.12) 30%,
          rgba(255,255,255,0.12) 70%,
          transparent
        );
      }

      /* Mitad derecha: texto + contador */
      #texto-wrap {
        flex: 0 0 50%;
        height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 2.5rem 3rem;
        gap: 0;
      }

      .message {
        font-family: 'Cormorant Garamond', Georgia, serif;
        font-size: clamp(17px, 2.2vw, 24px);
        font-weight: 300;
        font-style: italic;
        line-height: 1.9;
        text-align: center;
        color: rgba(255, 255, 255, 0.88);
        max-width: 380px;
        margin-bottom: 2.5rem;
        letter-spacing: 0.01em;
      }

      .message em {
        font-style: normal;
        font-weight: 400;
        color: hsl(48, 92%, 68%);
      }

      .counter-row {
        display: flex;
        gap: clamp(6px, 1.5vw, 14px);
        align-items: flex-end;
      }

      .unit {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 5px;
      }

      .digit {
        font-family: 'Cormorant Garamond', Georgia, serif;
        font-size: clamp(32px, 4.5vw, 52px);
        font-weight: 300;
        line-height: 1;
        color: rgba(255, 255, 255, 0.93);
        min-width: 2.2ch;
        text-align: center;
        border-bottom: 0.5px solid rgba(255, 255, 255, 0.28);
        padding-bottom: 5px;
      }

      .unit-label {
        font-size: clamp(9px, 0.9vw, 11px);
        letter-spacing: 0.15em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.4);
        font-family: Georgia, serif;
      }

      .sep {
        font-family: 'Cormorant Garamond', Georgia, serif;
        font-size: clamp(24px, 3.5vw, 40px);
        font-weight: 300;
        color: rgba(255, 255, 255, 0.25);
        padding-bottom: 14px;
        line-height: 1;
      }

      .note {
        font-family: 'Cormorant Garamond', Georgia, serif;
        font-size: clamp(11px, 1vw, 13px);
        font-style: italic;
        color: rgba(255, 255, 255, 0.28);
        margin-top: 1.3rem;
        letter-spacing: 0.05em;
        text-align: center;
      }

      /* ── Móvil: apilado vertical ────────────────────────── */
      @media (max-width: 640px) {
        body { flex-direction: column; }

        #flor-wrap {
          flex: 0 0 52vh;
          width: 100%;
          height: 52vh;
        }

        #flor-wrap::after {
          top: auto;
          right: 10%;
          bottom: 0;
          width: 80%;
          height: 0.5px;
          background: linear-gradient(
            to right,
            transparent,
            rgba(255,255,255,0.12) 30%,
            rgba(255,255,255,0.12) 70%,
            transparent
          );
        }

        #texto-wrap {
          flex: 1;
          width: 100%;
          height: auto;
          padding: 1.8rem 1.5rem;
          justify-content: center;
        }

        .message {
          font-size: clamp(16px, 4.5vw, 20px);
          margin-bottom: 1.8rem;
        }

        .digit { font-size: clamp(28px, 8vw, 42px); }
      }
    </style>
  </head>
  <body>

    <!-- Mitad flor -->
    <div id="flor-wrap">
      <div class="scene"></div>
    </div>

    <!-- Mitad texto + contador -->
    <div id="texto-wrap">
      <p class="message" id="msg">
        esta <em>página</em> desaparecerá —<br>
        si hay algo de que hablar,<br>
        escríbeme <em>antes</em> que acabe<br>
        el contador.<br>
        si no… <em>se entenderá.</em>
      </p>

      <div id="counter-wrap">
        <div class="counter-row">
          <div class="unit">
            <span class="digit" id="d-dias">--</span>
            <span class="unit-label">días</span>
          </div>
          <span class="sep">·</span>
          <div class="unit">
            <span class="digit" id="d-horas">--</span>
            <span class="unit-label">horas</span>
          </div>
          <span class="sep">·</span>
          <div class="unit">
            <span class="digit" id="d-min">--</span>
            <span class="unit-label">min</span>
          </div>
          <span class="sep">·</span>
          <div class="unit">
            <span class="digit" id="d-seg">--</span>
            <span class="unit-label">seg</span>
          </div>
        </div>
        <p class="note">6 de julio · el pétalo cae</p>
      </div>
    </div>

    <script src="flor.js"></script>
    <script>
      const target = new Date('2026-07-06T00:00:00');

      function pad(n) { return String(Math.floor(n)).padStart(2, '0'); }

      function tick() {
        const diff = target - new Date();
        if (diff <= 0) {
          document.getElementById('counter-wrap').style.display = 'none';
          document.getElementById('msg').innerHTML =
            'el último pétalo cayó.<br><em>se entendió.</em>';
          return;
        }
        document.getElementById('d-dias').textContent  = pad(diff / 86400000);
        document.getElementById('d-horas').textContent = pad((diff % 86400000) / 3600000);
        document.getElementById('d-min').textContent   = pad((diff % 3600000) / 60000);
        document.getElementById('d-seg').textContent   = pad((diff % 60000) / 1000);
      }

      tick();
      setInterval(tick, 1000);
    </script>
  </body>
</html>
